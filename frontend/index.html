    -->
    <meta
      data-rh="true"
      name="description"
      content="BaZi Master — open-source full-stack BaZi charting, Tarot, I Ching, Zodiac, Zi Wei Dou Shu, Synastry and AI interpretation web app. 开源全栈八字排盘、塔罗、周易、星座、紫微斗数与 AI 解读应用。"
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="BaZi Master" />
    <meta data-rh="true" property="og:title" content="BaZi Master" />
    <meta
      data-rh="true"
      property="og:description"
      content="Open-source full-stack BaZi charting, Tarot, I Ching, Zodiac, Zi Wei Dou Shu, Synastry and AI interpretation web app."
    />
    <meta data-rh="true" name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0b0618" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
