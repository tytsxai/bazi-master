server {
    listen 80;

    # Matches the backend's JSON_BODY_LIMIT (1mb, see backend/config/app.js). This used to
    # be 50m, which meant nginx would buffer a 50MB body to disk before the backend
    # rejected it as too large — all of the cost, none of the protection.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Vite emits content-hashed filenames, so a given URL's contents can never change.
    # Cache them hard — without this every asset is revalidated on every page load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The three files that must NOT be cached. They keep stable names, so a cached copy
    # is served after a deploy has already replaced the hashed bundles it points at —
    # index.html then requests chunks that no longer exist and the app renders a blank
    # page until the user hard-refreshes. Same for the service worker: a stale sw.js
    # keeps serving the previous build from the PWA cache indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Serve static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy websocket connections to the backend
    location /ws/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
