# 按来源 IP 限制 /ws/ 的并发连接数。
#
# 后端的 WS_MAX_CONNECTIONS 是个全局上限，它只保证"整个进程不会被撑爆"，不保证
# 这 500 个槽位不被同一个人占光。而 /ws/ai 的 upgrade 握手不做认证（只看 path 和
# Origin，且不带 Origin 的非浏览器客户端直接放行），所以匿名占满全部槽位不需要任何
# 前置条件 —— 按 IP 限流是唯一挡得住这件事的地方，且只能做在拿得到真实地址的这一层。
#
# 10m 的 zone 约能记 16 万个地址；超限的连接按 limit_conn_status 返回 503，
# 和后端到顶时的响应码一致，客户端不需要区分是哪一层拒的。
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
limit_conn_log_level warn;
limit_conn_status 503;

server {
    listen 80;

    # Matches the backend's JSON_BODY_LIMIT (1mb, see backend/config/app.js). This used to
    # be 50m, which meant nginx would buffer a 50MB body to disk before the backend
    # rejected it as too large — all of the cost, none of the protection.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Vite emits content-hashed filenames, so a given URL's contents can never change.
    # Cache them hard — without this every asset is revalidated on every page load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The three files that must NOT be cached. They keep stable names, so a cached copy
    # is served after a deploy has already replaced the hashed bundles it points at —
    # index.html then requests chunks that no longer exist and the app renders a blank
    # page until the user hard-refreshes. Same for the service worker: a stale sw.js
    # keeps serving the previous build from the PWA cache indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Serve static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy websocket connections to the backend
    location /ws/ {
        # 一个页面只开一条 /ws/ai。给到 10 是为了容下多标签页，以及重连时新旧连接
        # 短暂重叠的那一瞬间。注意共享出口的场景（公司/校园 NAT）下这些用户共用一个
        # 计数，所以别调得太紧 —— 这是按 IP 限流的固有代价，不是配错了。
        #
        # 前提：$binary_remote_addr 必须是真实客户端地址。如果这个容器前面还套了一层
        # 外层 nginx 或 CDN，它拿到的就是那层的地址，于是全站所有人共用一个桶 ——
        # 和 TRUST_PROXY 数错跳数是同一个坑。那种部署下必须先放开下面两行并把网段填对，
        # 或者干脆把这段限流搬到真正的边缘那一层去。
        # set_real_ip_from  <外层代理的网段>;
        # real_ip_header    X-Forwarded-For;
        limit_conn ws_per_ip 10;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
