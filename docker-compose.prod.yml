# Docker's default json-file log driver has no size cap, so every service below pins one.
# Without it the host disk fills up over weeks and postgres is the first thing to break.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:16
    container_name: bazi_postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default on purpose: a missing password must fail the deploy, not silently
      # start postgres with a well-known weak credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bazi_master}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bazi_master}']
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:7
    container_name: bazi_redis
    restart: always
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bazi_backend
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bazi_master}?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      ALLOW_LOCALHOST_PROD: ${ALLOW_LOCALHOST_PROD:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SESSION_IDLE_MS: ${SESSION_IDLE_MS:-}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_SCOPE: ${WECHAT_SCOPE:-}
      WECHAT_FRONTEND_URL: ${WECHAT_FRONTEND_URL:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
      RESET_TOKEN_TTL_MS: ${RESET_TOKEN_TTL_MS:-}
      RESET_REQUEST_MIN_DURATION_MS: ${RESET_REQUEST_MIN_DURATION_MS:-}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-}
      PASSWORD_RESET_SUBJECT: ${PASSWORD_RESET_SUBJECT:-}
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-}
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${GRACEFUL_SHUTDOWN_TIMEOUT_MS:-}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-}
      SERVER_KEEP_ALIVE_TIMEOUT_MS: ${SERVER_KEEP_ALIVE_TIMEOUT_MS:-}
      SERVER_HEADERS_TIMEOUT_MS: ${SERVER_HEADERS_TIMEOUT_MS:-}
      SERVER_REQUEST_TIMEOUT_MS: ${SERVER_REQUEST_TIMEOUT_MS:-}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      DOCS_USER: ${DOCS_USER:-}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALLOW_DEV_OAUTH: ${ALLOW_DEV_OAUTH:-false}
      SEED_DEFAULT_USER: ${SEED_DEFAULT_USER:-false}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_USER_NAME: ${SEED_USER_NAME:-}
      ALLOW_RUNTIME_SCHEMA_SYNC: ${ALLOW_RUNTIME_SCHEMA_SYNC:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-}
      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-}
      MAX_INPUT_ARRAY_LENGTH: ${MAX_INPUT_ARRAY_LENGTH:-}
      MAX_INPUT_DEPTH: ${MAX_INPUT_DEPTH:-}
      MAX_INPUT_KEYS: ${MAX_INPUT_KEYS:-}
      MAX_INPUT_STRING_LENGTH: ${MAX_INPUT_STRING_LENGTH:-}
      BAZI_CACHE_TTL_MS: ${BAZI_CACHE_TTL_MS:-}
      BAZI_CACHE_MAX_ENTRIES: ${BAZI_CACHE_MAX_ENTRIES:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}
      # Make sure to set these in .env or CI secrets
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    ports:
      # Loopback by default: TLS termination and the public edge belong to nginx.
      # Publishing to 0.0.0.0 writes iptables rules that bypass ufw/firewalld.
      - '${BACKEND_BIND_ADDR:-127.0.0.1}:4000:4000'
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1g}
    # 每条 WebSocket 连接吃一个文件描述符，而 WS_MAX_CONNECTIONS 默认 500 —— 加上
    # HTTP keep-alive、Prisma 连接池和日志句柄，撞上 fd 上限是比撞内存早得多的事：
    # 实测每条空闲 WS 连接只占约 9KB RSS，500 条也才 ~4.4MB（内存限额的 0.4%），
    # 所以真正的约束从来不是内存。撞上 fd 的表现是 EMFILE，届时 accept 全线失败，
    # 比 OOM 更难查。这里显式写死，不去赌 dockerd 继承下来的默认值是多少。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 必须大于 SHUTDOWN_DRAIN_MS + GRACEFUL_SHUTDOWN_TIMEOUT_MS（默认 5s + 10s），
    # 否则排水还没走完容器就被 SIGKILL 了。调大排水窗口时这里要跟着调。
    stop_grace_period: 30s
    labels:
      # Opts this container into the autoheal watcher below. `restart: always` only
      # covers a process that exits; a container that stays up while failing its
      # healthcheck (stalled event loop, exhausted connection pool) is never restarted
      # by compose on its own.
      autoheal: 'true'
    healthcheck:
      # Liveness, not readiness. This healthcheck drives autoheal (above), so whatever it
      # measures is what gets the container restarted. /api/ready is a *deep* check — it
      # fails whenever postgres or redis is briefly unreachable, and restarting the
      # backend for that is actively harmful: the new process exits at startup when it
      # cannot reach the database, so `restart: always` turns a ten-second database blip
      # into a crash loop, where doing nothing would have let Prisma reconnect on its own.
      # /live still catches what autoheal is for — a wedged event loop cannot answer it.
      #
      # /api/ready remains the signal for the load balancer, which should drain rather
      # than restart. It also reports 503 while the process is draining on SIGTERM.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_CDN_URL: ${VITE_CDN_URL:-/}
    container_name: bazi_frontend
    restart: always
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - '${FRONTEND_BIND_ADDR:-127.0.0.1}:3000:80'
    # nginx 代理一条 WebSocket 要占两个 fd（对客户端一个、对 backend 一个），所以这一层
    # 的 fd 需求是后端的两倍左右。nginx 的 worker_connections 同样受 fd 上限约束：
    # 到顶时日志里是 "worker_connections are not enough"，而不是任何和 WebSocket
    # 有关的字样，很容易查错方向。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      autoheal: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

  # Restarts any container labelled autoheal=true once its healthcheck reports
  # unhealthy. Plain `docker compose` never does this itself — that behaviour belongs to
  # Swarm/Kubernetes — so without this a wedged backend sits unhealthy indefinitely with
  # nobody watching.
  #
  # Deliberately NOT applied to postgres or redis: they are stateful, and bouncing a
  # database on a failing healthcheck tends to turn one problem into two. If those go
  # unhealthy a human should look.
  #
  # Tradeoff, stated plainly: this needs the Docker socket, which is equivalent to root
  # on the host. Mounting it :ro does not actually restrict what can be asked over the
  # socket — it only makes the file node read-only — so treat this container as
  # privileged and pin the image tag. If that is unacceptable, drop this service and use
  # the host-cron fallback in scripts/install-cron.sh instead.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: bazi_autoheal
    restart: always
    logging: *default-logging
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # Seconds between checks.
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-10}
      # Grace period after this watcher starts, so a still-booting stack is not bounced.
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD:-60}
      # Seconds to wait for a graceful stop before killing. Keep at or above the
      # backend's stop_grace_period (30s) or restarts will truncate in-flight requests —
      # which is the very thing the graceful shutdown path exists to avoid.
      DOCKER_TIMEOUT: ${AUTOHEAL_DOCKER_TIMEOUT:-40}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  redis_data:
