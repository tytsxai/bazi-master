name: CI

on:
  push:
    branches: ['master', 'main']
  pull_request:
    branches: ['master', 'main']

# The engine is stateless: no database, no migrations, no fixtures. This job used to
# provision a PostgreSQL service and run `prisma migrate reset` before the tests; both went
# away with the storage layer. Nothing here needs a service container any more, which is
# also why the whole run is now a couple of minutes shorter.
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The project requires Node 20+ (see README and docs); testing 18 verified a
        # version that is not supported.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      # Cheap and dependency-free, so it runs before anything is installed. Guards against
      # re-committing the verification screenshots and database fixtures that had grown the
      # history to 735MB for a 5MB source tree.
      - name: Check no build/test artifacts are committed
        run: ./scripts/check-repo-artifacts.sh

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      # ESLint and Prettier are configured at the repository root, not in backend/.
      # This step used to run `npm run lint --if-present` inside backend/, where no
      # lint script exists, so it always passed without checking anything.
      - name: Lint & Format Check
        run: |
          npm ci
          npm run lint
          npm run format:check

      - name: Check env template covers every variable the code reads
        run: ./scripts/check-env-template.sh

      # docs/openapi.json is generated from services/apiSchema.service.js. Regenerating it
      # here and failing on a diff is what keeps the committed artifact from going stale —
      # the file is what external consumers read, and nobody notices a stale one by looking.
      - name: Check the committed OpenAPI snapshot is up to date
        run: |
          cd backend
          node scripts/generate-openapi.js
          git diff --exit-code -- ../docs/openapi.json

      # Runtime dependencies only: a vulnerability in a build-time devDependency does not
      # ship, and letting those fail the build is how audit gates get switched off. `high`
      # is the threshold because moderate advisories in this tree are routinely
      # unreachable ones, and a gate that cries wolf stops being read.
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

      - name: Run Backend Tests
        run: |
          cd backend
          NODE_ENV=test npm test

      # The CLI is how every workflow in this repo is driven, so a break in it blocks
      # all of them. Its own contract tests are fast and need no services.
      - name: Run CLI Contract Tests
        run: npm run test:cli
